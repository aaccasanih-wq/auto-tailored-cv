[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-tailored-cv"
version = "0.1.0"
description = "Automatically tailor your résumé for each job you saved on LinkedIn."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Axel Ccasani" }]
keywords = ["linkedin", "cv", "resume", "llm", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
auto-tailored-cv = "run:main"

[tool.setuptools]
packages = [
    "src",
    "src.extract",
    "src.profile",
    "src.render",
    "src.render.legacy",
    "src.review",
    "src.tailor",
    "src.utils",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["input", "jobs", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra -q"